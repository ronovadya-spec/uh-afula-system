<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת ציוד - עפולה</title>

<style>
body{
  font-family: Arial;
  direction: rtl;
  background:#f5f5f5;
  text-align:center;
}

.box{
  background:white;
  max-width:520px;
  margin:auto;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,button{
  padding:10px;
  margin:8px;
  width:85%;
  font-size:16px;
}

button{
  background:orange;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

/* 🔥 טאבים */
.tab{
  display:none;
  opacity:0;
  transform:translateY(10px);
  transition:0.3s ease;
}

.tab.active{
  display:block;
  opacity:1;
  transform:translateY(0);
}

/* 🔥 פריטים עם אנימציה */
.item{
  background:#f8f8f8;
  margin:10px;
  padding:12px;
  border-radius:10px;

  opacity:0;
  transform:scale(0.95);
  animation:fadeIn 0.35s ease forwards;
}

@keyframes fadeIn{
  to{
    opacity:1;
    transform:scale(1);
  }
}

.item:hover{
  transform:scale(1.02);
  transition:0.2s;
}

/* כפתורי ➕➖ */
.item button{
  width:40px;
  margin:5px;
}
</style>
</head>

<body>

<div class="box">

<h2>🚑 מערכת ציוד - עפולה</h2>

<div id="loginBox">
  <input id="codeInput" placeholder="קוד כונן" />
  <button onclick="login()">כניסה</button>
  <p id="msg"></p>
</div>

<div id="menu" style="display:none;">
  <h3 id="welcome"></h3>

  <button onclick="showTab('bls')">🚑 BLS</button>
  <button onclick="showTab('mish')">🎒 משתלם</button>
  <button onclick="showTab('honor')">❤️ תן כבוד</button>

  <div id="bls" class="tab"></div>
  <div id="mish" class="tab"></div>
  <div id="honor" class="tab"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDplJPY5X9D7PeorWsMwJswqF5Q9vq730",
  authDomain:"afula-equipment.firebaseapp.com",
  projectId:"afula-equipment"
});

const db = getFirestore(app);

let state={bls:[],mish:[],honor:[]};

/* ---------- LOGIN ---------- */
window.login=async function(){

  const code=document.getElementById("codeInput").value.trim();

  const snap=await getDocs(collection(db,"volunteers"));

  let found=null;

  snap.forEach(d=>{
    const x=d.data();
    if(String(x.code)===String(code)) found=x;
  });

  if(!found){
    document.getElementById("msg").innerText="כונן לא נמצא";
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("menu").style.display="block";

  document.getElementById("welcome").innerText="שלום "+found.name;

  await loadMenus();
  renderAll();

  showTab("bls");
};

/* ---------- LOAD ---------- */
async function loadMenus(){

  const snap=await getDocs(collection(db,"menus"));

  snap.forEach(doc=>{
    state[doc.id]=doc.data().items.map(i=>({
      name:i.name,
      max:i.max,
      val:0
    }));
  });
}

/* ---------- RENDER ---------- */
function renderAll(){
  render("bls");
  render("mish");
  render("honor");
}

function render(t){

  if(!state[t]) return;

  let html="";

  state[t].forEach((i,idx)=>{
    html+=`
      <div class="item">
        <b>${i.name}</b><br/>
        תקן: ${i.max}<br/>

        <button onclick="minus('${t}',${idx})">➖</button>
        ${i.val}
        <button onclick="plus('${t}',${idx})">➕</button>
      </div>
    `;
  });

  document.getElementById(t).innerHTML=html;
}

/* ---------- TABS ---------- */
window.showTab=function(t){

  document.querySelectorAll(".tab").forEach(x=>{
    x.classList.remove("active");
  });

  const el=document.getElementById(t);
  el.classList.add("active");
};

/* ---------- PLUS MINUS ---------- */
window.plus=function(t,i){
  if(state[t][i].val<state[t][i].max){
    state[t][i].val++;
    render(t);
  }
};

window.minus=function(t,i){
  if(state[t][i].val>0){
    state[t][i].val--;
    render(t);
  }
};
</script>

</body>
</html>
