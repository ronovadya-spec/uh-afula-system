<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>בדיקת BLS</title>
<style>
body{font-family:Arial;direction:rtl;text-align:center;background:#f5f5f5;padding:20px}
.box{background:white;max-width:500px;margin:auto;padding:20px;border-radius:12px}
button,input{padding:12px;margin:8px;width:85%;font-size:16px}
button{background:orange;color:white;border:0;border-radius:8px}
.item{background:#f8f8f8;margin:10px;padding:12px;border-radius:10px}
</style>
</head>
<body>

<div class="box">
  <h2>🚑 מערכת ציוד - עפולה</h2>

  <div id="loginBox">
    <input id="codeInput" placeholder="הכנס קוד כונן">
    <button onclick="login()">כניסה</button>
    <p id="msg"></p>
  </div>

  <div id="app" style="display:none">
    <h3 id="hello"></h3>
    <button onclick="loadBLS()">🚑 כונן BLS</button>
    <div id="content"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDplJPY5X9D7PeorWsMwJswqF5Q9vq730",
  authDomain:"afula-equipment.firebaseapp.com",
  projectId:"afula-equipment"
});

const db = getFirestore(app);

window.login = async function(){
  const code = document.getElementById("codeInput").value.trim();
  const snap = await getDocs(collection(db,"volunteers"));

  let found = null;
  snap.forEach(doc=>{
    const d = doc.data();
    if(String(d.code || d.Code).trim() === code){
      found = d;
    }
  });

  if(!found){
    document.getElementById("msg").innerText = "כונן לא נמצא";
    return;
  }

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("hello").innerText = "שלום " + (found.name || found.Name);
};

window.loadBLS = async function(){
  document.getElementById("content").innerHTML = "טוען...";

  const menusSnap = await getDocs(collection(db,"menus"));
  let blsId = null;

  menusSnap.forEach(doc=>{
    const d = doc.data();
    if(d.title === "BLS"){
      blsId = doc.id;
    }
  });

  if(!blsId){
    document.getElementById("content").innerHTML = "לא נמצא מסמך BLS";
    return;
  }

  const itemsSnap = await getDocs(collection(db,"menus",blsId,"items"));

  let html = "<h3>פריטי BLS</h3>";

  if(itemsSnap.empty){
    html += "<p>לא נמצאו פריטים</p>";
  }

  itemsSnap.forEach(doc=>{
    const item = doc.data();
    html += `
      <div class="item">
        <b>${item.name}</b><br>
        תקן: ${item.max}
      </div>
    `;
  });

  document.getElementById("content").innerHTML = html;
};
</script>

</body>
</html>
