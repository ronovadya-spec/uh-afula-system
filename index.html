<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת ציוד</title>

<style>
body{
  font-family: Arial;
  direction: rtl;
  background:#f5f5f5;
  text-align:center;
}

.box{
  background:white;
  max-width:520px;
  margin:auto;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* כפתורי טאבים */
.tabs button{
  width:30%;
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:orange;
  color:white;
  cursor:pointer;
  font-size:14px;
}

.tab{
  display:none;
  margin-top:15px;
}

.item{
  background:#f8f8f8;
  margin:8px;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h2>🚑 מערכת ציוד</h2>

<div class="tabs">
  <button onclick="openTab('bls')">🚑 כונן BLS</button>
  <button onclick="openTab('mish')">🎒 משתלם</button>
  <button onclick="openTab('heart')">❤️ תן כבוד</button>
</div>

<div id="bls" class="tab"></div>
<div id="mish" class="tab"></div>
<div id="heart" class="tab"></div>

</div>

<script>
/* ---------- DATA ---------- */
const data = {
  bls: [
    {name:"כפפות M", max:100},
    {name:"פלסטרים", max:10},
    {name:"תחבושת אישית", max:2}
  ],
  mish: [
    {name:"כפפות M", max:30},
    {name:"מדל״ד", max:1}
  ],
  heart: [
    {name:"פלסטרים", max:10},
    {name:"גזה", max:20},
    {name:"כפפות S", max:30}
  ]
};

/* ---------- TABS ---------- */
function openTab(tab){

  // סגירה של כולם
  document.getElementById("bls").style.display="none";
  document.getElementById("mish").style.display="none";
  document.getElementById("heart").style.display="none";

  // פתיחה של הנבחר
  document.getElementById(tab).style.display="block";

  render(tab);
}

/* ---------- RENDER ---------- */
function render(tab){

  let html = "";

  data[tab].forEach(i=>{
    html += `
      <div class="item">
        <b>${i.name}</b><br/>
        תקן: ${i.max}
      </div>
    `;
  });

  document.getElementById(tab).innerHTML = html;
}

/* פתיחה ראשונית */
openTab('bls');
</script>

</body>
</html>
