<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת ציוד - עפולה</title>
<style>
body{font-family:Arial;direction:rtl;text-align:center;background:#f5f5f5;padding:20px}
.box{background:white;max-width:540px;margin:auto;padding:20px;border-radius:16px;box-shadow:0 0 12px #ddd}
button,input{padding:12px;margin:8px;width:85%;font-size:16px}
button{background:#ff8c00;color:white;border:0;border-radius:10px}
button:disabled{background:#ccc}
.category{margin-top:24px;font-weight:bold;color:#ff8c00;font-size:22px}
.item{position:relative;background:#f8f8f8;margin:12px;padding:18px;border-radius:14px;border:2px solid transparent}
.item.selected{border-color:#ff8c00;background:#fff7ee}
.info{position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;padding:0;margin:0;font-weight:bold}
.qty button{width:54px;margin:8px;font-size:22px}
.qty span{font-size:24px;font-weight:bold;margin:0 16px}
.summary{font-weight:bold;color:#ff8c00;margin:12px}
.submit{margin-top:20px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center}
.modal-box{background:white;width:85%;max-width:360px;border-radius:16px;padding:22px}
</style>
</head>
<body>

<div class="box">
  <h2>🚑 מערכת ציוד - סניף עפולה</h2>

  <div id="loginBox">
    <input id="codeInput" placeholder="הכנס קוד כונן">
    <button onclick="login()">כניסה</button>
    <p id="msg"></p>
  </div>

  <div id="app" style="display:none">
    <h3 id="hello"></h3>

    <button onclick="loadBLS()">🚑 כונן BLS</button>
    <button disabled>🎒 משתלם</button>
    <button disabled>❤️ תן כבוד</button>

    <div id="content"></div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button onclick="closeInfo()">סגור</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDplJPY5X9D7PeorWsMwJswqF5Q9vq730",
  authDomain:"afula-equipment.firebaseapp.com",
  projectId:"afula-equipment"
});

const db = getFirestore(app);
let currentUser = null;
let blsItems = [];

window.login = async function(){
  const code = document.getElementById("codeInput").value.trim();
  const snap = await getDocs(collection(db,"volunteers"));

  let found = null;
  snap.forEach(doc=>{
    const d = doc.data();
    if(String(d.code || d.Code).trim() === code){
      found = { code:String(d.code || d.Code).trim(), name:d.name || d.Name };
    }
  });

  if(!found){
    document.getElementById("msg").innerText = "כונן לא נמצא";
    return;
  }

  currentUser = found;
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("hello").innerText = "שלום " + found.name;
};

window.loadBLS = async function(){
  document.getElementById("content").innerHTML = "טוען...";

  const menusSnap = await getDocs(collection(db,"menus"));
  let blsId = null;

  menusSnap.forEach(doc=>{
    if(doc.data().title === "BLS") blsId = doc.id;
  });

  if(!blsId){
    document.getElementById("content").innerHTML = "לא נמצא מסמך BLS";
    return;
  }

  const itemsSnap = await getDocs(collection(db,"menus",blsId,"items"));

  blsItems = [];
  itemsSnap.forEach(doc=>{
    const d = doc.data();
    blsItems.push({
      name: d.name,
      max: Number(d.max || 0),
      category: d.category || "ללא קטגוריה",
      order: Number(d.order || 999),
      step: Number(d.step || 1),
      qty: 0
    });
  });

  blsItems.sort((a,b)=>a.order-b.order);
  renderBLS();
};

function selectedCount(){
  return blsItems.filter(i => i.qty > 0).length;
}

function renderBLS(){
  let html = "<h3>🚑 כונן BLS</h3>";
  html += `<div class="summary">${selectedCount()} פריטים נבחרו</div>`;

  let currentCategory = "";

  blsItems.forEach((item,index)=>{
    if(item.category !== currentCategory){
      currentCategory = item.category;
      html += `<div class="category">${currentCategory}</div>`;
    }

    html += `
      <div class="item ${item.qty > 0 ? "selected" : ""}">
        <button class="info" onclick="showInfo(${index})">i</button>
        <b>${item.name}</b>

        <div class="qty">
          <button onclick="changeQty(${index}, 1)" ${item.qty >= item.max ? "disabled" : ""}>➕</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${index}, -1)" ${item.qty <= 0 ? "disabled" : ""}>➖</button>
        </div>
      </div>
    `;
  });

  html += `
    <button class="submit" ${selectedCount() === 0 ? "disabled" : ""} onclick="alert('בשלב הבא נחבר שליחה')">
      📦 שלח הזמנה
    </button>
  `;

  document.getElementById("content").innerHTML = html;
}

window.changeQty = function(index, direction){
  const item = blsItems[index];
  const next = item.qty + (item.step * direction);

  if(next < 0) item.qty = 0;
  else if(next > item.max) item.qty = item.max;
  else item.qty = next;

  renderBLS();
};

window.showInfo = function(index){
  const item = blsItems[index];
  document.getElementById("modalTitle").innerText = item.name;
  document.getElementById("modalText").innerText = "תקן: " + item.max;
  document.getElementById("modal").style.display = "flex";
};

window.closeInfo = function(){
  document.getElementById("modal").style.display = "none";
};
</script>

</body>
</html>
