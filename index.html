<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת ציוד - עפולה</title>

<style>

.box {

  padding: 20px;

  max-width: 450px;
  margin: auto;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, button {
  padding: 10px;
  margin: 10px;
  width: 85%;
  font-size: 16px;
}

button {
  background: orange;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 6px;
}

button:hover {
  background: darkorange;
}

.item {
  margin: 10px 0;
  padding: 10px;
  background: #fafafa;

}

.hidden { display: none; }
</style>
</head>

<body>

<div class="box">

<h2>🚑 מערכת ציוד - סניף עפולה</h2>

<!-- התחברות -->
<div id="loginBox">
  <input id="codeInput" placeholder="הכנס מספר כונן" />
  <button onclick="login()">כניסה</button>
  <p id="msg"></p>
</div>

<!-- תפריט -->
<div id="menu" class="hidden">
  <h3 id="welcome"></h3>

  <button onclick="openBLS()">🚑 כונן BLS</button>
  <button onclick="alert('משתלם בהמשך')">🎒 משתלם</button>
  <button onclick="alert('תן כבוד בהמשך')">❤️ תן כבוד</button>

  <div id="content"></div>
</div>

</div>

import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDplJPY5X9D7PeorWsMwJswqF5Q9vq730",
  authDomain: "afula-equipment.firebaseapp.com",
  projectId: "afula-equipment",

  messagingSenderId: "1017822544815",
  appId: "1:1017822544815:web:15b410398a8908fc9d655a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;

// 🔥 חשוב: תמיכה גם ב-Code וגם code (כדי שלא יישבר שוב)
function normalize(data) {
  return {
    code: String(data.code || data.Code || "").trim(),
    name: String(data.name || data.Name || "")
  };
}

// התחברות
window.login = async function () {

  const code = document.getElementById("codeInput").value.trim();

  if (!code) {
    document.getElementById("msg").innerText = "הכנס מספר כונן";
    return;
  }

  const snap = await getDocs(collection(db, "volunteers"));

  let found = null;

  snap.forEach(doc => {
    const data = normalize(doc.data());

    if (data.code === code) {
      found = data;
    }
  });

  if (!found) {
    document.getElementById("msg").innerText = "כונן לא נמצא";
    return;
  }

  currentUser = found;

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");

  document.getElementById("welcome").innerText =
    "שלום " + found.name;
};
