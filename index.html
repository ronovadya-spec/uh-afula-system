<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת ציוד - עפולה</title>

<style>
body{
  font-family: Arial;
  direction: rtl;
  background:#f5f5f5;
  text-align:center;
}

.box{
  background:white;
  max-width:520px;
  margin:auto;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,button{
  padding:10px;
  margin:8px;
  width:85%;
  font-size:16px;
}

button{
  background:orange;
  border:none;
  color:white;
  border-radius:6px;
}

.tab-btn{
  width:30%;
  margin:5px;
}

.item{
  background:#f8f8f8;
  margin:10px;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h2>🚑 מערכת ציוד</h2>

<div id="loginBox">
  <input id="codeInput" placeholder="קוד כונן" />
  <button onclick="login()">כניסה</button>
  <p id="msg"></p>
</div>

<div id="app" style="display:none;">

  <h3 id="hello"></h3>

  <button class="tab-btn" onclick="showTab('bls')">BLS</button>
  <button class="tab-btn" onclick="showTab('mish')">משתלם</button>
  <button class="tab-btn" onclick="showTab('honor')">תן כבוד</button>

  <div id="content"></div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDplJPY5X9d7PeorWsMwJswqF5Q9vq730",
  authDomain:"afula-equipment.firebaseapp.com",
  projectId:"afula-equipment"
});

const db = getFirestore(app);

let user = null;
let menus = {};
let currentTab = "bls";

/* ---------- LOGIN ---------- */
window.login = async function(){

  const code = document.getElementById("codeInput").value.trim();

  const snap = await getDocs(collection(db,"volunteers"));

  let found = null;

  snap.forEach(d=>{
    const x = d.data();
    if(String(x.code) === String(code)) found = x;
  });

  if(!found){
    document.getElementById("msg").innerText = "כונן לא נמצא";
    return;
  }

  user = found;

  document.getElementById("loginBox").style.display="none";
  document.getElementById("app").style.display="block";

  document.getElementById("hello").innerText = "שלום " + found.name;

  await loadMenus();

  showTab("bls");
};

/* ---------- LOAD ---------- */
async function loadMenus(){

  const snap = await getDocs(collection(db,"menus"));

  menus = {};

  snap.forEach(doc=>{
    menus[doc.data().title.toLowerCase()] = doc.data().items;
  });
}

/* ---------- TABS ---------- */
window.showTab = function(tab){

  currentTab = tab;

  const items = menus[tab];

  if(!items){
    document.getElementById("content").innerHTML = "אין נתונים";
    return;
  }

  let html = "";

  items.forEach(i=>{
    html += `
      <div class="item">
        <b>${i.name}</b><br/>
        תקן: ${i.max}
      </div>
    `;
  });

  document.getElementById("content").innerHTML = html;
};

</script>

</body>
</html>
