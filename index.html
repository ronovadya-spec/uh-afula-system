<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת ציוד - עפולה</title>

<style>
body{
  font-family: Arial;
  direction: rtl;
  background:#f5f5f5;
  text-align:center;
}

.box{
  background:white;
  max-width:520px;
  margin:auto;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,button{
  padding:10px;
  margin:8px;
  width:85%;
  font-size:16px;
}

button{
  background:orange;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

.tab{
  display:none;
}

.item{
  background:#f8f8f8;
  margin:10px;
  padding:12px;
  border-radius:10px;
  animation:fade 0.25s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.item button{
  width:40px;
}
</style>
</head>

<body>

<div class="box">

<h2>🚑 מערכת ציוד - עפולה</h2>

<div id="loginBox">
  <input id="codeInput" placeholder="קוד כונן" />
  <button onclick="login()">כניסה</button>
  <p id="msg"></p>
</div>

<div id="menu" style="display:none;">

  <h3 id="welcome"></h3>

  <div id="tabs"></div>

  <div id="content"></div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDplJPY5X9d7PeorWsMwJswqF5Q9vq730",
  authDomain:"afula-equipment.firebaseapp.com",
  projectId:"afula-equipment"
});

const db = getFirestore(app);

let user = null;
let menus = {};
let state = {};

/* ---------- LOGIN ---------- */
window.login = async function(){

  const code = document.getElementById("codeInput").value.trim();

  const snap = await getDocs(collection(db,"volunteers"));

  let found = null;

  snap.forEach(d=>{
    const x=d.data();
    if(String(x.code) === String(code)) found = x;
  });

  if(!found){
    document.getElementById("msg").innerText="כונן לא נמצא";
    return;
  }

  user = found;

  document.getElementById("loginBox").style.display="none";
  document.getElementById("menu").style.display="block";

  document.getElementById("welcome").innerText="שלום "+found.name;

  await loadMenus();
  renderTabs();
};

/* ---------- LOAD MENUS ---------- */
async function loadMenus(){

  const snap = await getDocs(collection(db,"menus"));

  snap.forEach(doc=>{
    menus[doc.id] = doc.data();
    state[doc.id] = doc.data().items.map(i=>({
      name:i.name,
      max:i.max,
      val:0
    }));
  });
}

/* ---------- TABS ---------- */
function renderTabs(){

  let html="";

  Object.keys(menus).forEach(key=>{
    html += `<button onclick="openTab('${key}')">${menus[key].title}</button>`;
  });

  document.getElementById("tabs").innerHTML = html;

  // פותח ראשון
  const first = Object.keys(menus)[0];
  openTab(first);
}

window.openTab = function(tab){

  let html="";

  state[tab].forEach((item,i)=>{

    html += `
      <div class="item">
        <b>${item.name}</b><br/>
        תקן: ${item.max}<br/>

        <button onclick="minus('${tab}',${i})">➖</button>
        ${item.val}
        <button onclick="plus('${tab}',${i})">➕</button>
      </div>
    `;
  });

  document.getElementById("content").innerHTML = html;
};

/* ---------- PLUS MINUS ---------- */
window.plus = function(tab,i){
  if(state[tab][i].val < state[tab][i].max){
    state[tab][i].val++;
    openTab(tab);
  }
};

window.minus = function(tab,i){
  if(state[tab][i].val > 0){
    state[tab][i].val--;
    openTab(tab);
  }
};
</script>

</body>
</html>
