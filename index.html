<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת ציוד - עפולה</title>
<style>
body{font-family:Arial;direction:rtl;text-align:center;background:#f5f5f5;padding:20px}
.box{background:white;max-width:520px;margin:auto;padding:20px;border-radius:12px;box-shadow:0 0 10px #ddd}
button,input{padding:12px;margin:8px;width:85%;font-size:16px}
button{background:#ff8c00;color:white;border:0;border-radius:8px}
.category{margin-top:20px;font-weight:bold;color:#ff8c00;font-size:20px}
.item{background:#f8f8f8;margin:10px;padding:12px;border-radius:10px}
.qty button{width:45px;margin:5px}
.qty span{font-size:20px;font-weight:bold;margin:0 12px}
</style>
</head>
<body>

<div class="box">
  <h2>🚑 מערכת ציוד - סניף עפולה</h2>

  <div id="loginBox">
    <input id="codeInput" placeholder="הכנס קוד כונן">
    <button onclick="login()">כניסה</button>
    <p id="msg"></p>
  </div>

  <div id="app" style="display:none">
    <h3 id="hello"></h3>

    <button onclick="loadBLS()">🚑 כונן BLS</button>
    <button disabled>🎒 משתלם</button>
    <button disabled>❤️ תן כבוד</button>

    <div id="content"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDplJPY5X9D7PeorWsMwJswqF5Q9vq730",
  authDomain:"afula-equipment.firebaseapp.com",
  projectId:"afula-equipment"
});

const db = getFirestore(app);
let currentUser = null;
let blsItems = [];

window.login = async function(){
  const code = document.getElementById("codeInput").value.trim();
  const snap = await getDocs(collection(db,"volunteers"));

  let found = null;
  snap.forEach(doc=>{
    const d = doc.data();
    if(String(d.code || d.Code).trim() === code){
      found = {
        code: String(d.code || d.Code).trim(),
        name: d.name || d.Name
      };
    }
  });

  if(!found){
    document.getElementById("msg").innerText = "כונן לא נמצא";
    return;
  }

  currentUser = found;
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("hello").innerText = "שלום " + found.name;
};

window.loadBLS = async function(){
  document.getElementById("content").innerHTML = "טוען...";

  const menusSnap = await getDocs(collection(db,"menus"));
  let blsId = null;

  menusSnap.forEach(doc=>{
    const d = doc.data();
    if(d.title === "BLS"){
      blsId = doc.id;
    }
  });

  if(!blsId){
    document.getElementById("content").innerHTML = "לא נמצא מסמך BLS";
    return;
  }

  const itemsSnap = await getDocs(collection(db,"menus",blsId,"items"));

  blsItems = [];
  itemsSnap.forEach(doc=>{
    const d = doc.data();
    blsItems.push({
      id: doc.id,
      name: d.name,
      max: Number(d.max || 0),
      category: d.category || "ללא קטגוריה",
      order: Number(d.order || 999),
      step: Number(d.step || 1),
      qty: 0
    });
  });

  blsItems.sort((a,b)=>a.order-b.order);
  renderBLS();
};

function renderBLS(){
  let html = "<h3>🚑 כונן BLS</h3>";
  let currentCategory = "";

  blsItems.forEach((item,index)=>{
    if(item.category !== currentCategory){
      currentCategory = item.category;
      html += `<div class="category">${currentCategory}</div>`;
    }

    html += `
      <div class="item">
        <b>${item.name}</b><br>
        תקן: ${item.max}<br>
        קפיצה: ${item.step}
        <div class="qty">
          <button onclick="changeQty(${index}, -1)">➖</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${index}, 1)">➕</button>
        </div>
      </div>
    `;
  });

  document.getElementById("content").innerHTML = html;
}

window.changeQty = function(index, direction){
  const item = blsItems[index];
  const next = item.qty + (item.step * direction);

  if(next < 0){
    item.qty = 0;
  } else if(next > item.max){
    item.qty = item.max;
  } else {
    item.qty = next;
  }

  renderBLS();
};
</script>

</body>
</html>
