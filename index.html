<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>מערכת ציוד - עפולה</title>
  <style>
    body {
      font-family: Arial;
      direction: rtl;
      background: #f5f5f5;
      text-align: center;
      padding: 40px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, button {
      padding: 10px;
      margin: 10px;
      width: 80%;
    }

    button {
      background: orange;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: darkorange;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="box">

  <h2>🚑 מערכת ציוד - סניף עפולה</h2>

  <div id="loginBox">
    <input id="codeInput" placeholder="הכנס מספר כונן" />
    <button onclick="login()">כניסה</button>
    <p id="msg"></p>
  </div>

  <div id="menu" class="hidden">
    <h3 id="welcome"></h3>

    <button onclick="alert('כונן BLS בהמשך')">🚑 כונן BLS</button>
    <button onclick="alert('משתלם בהמשך')">🎒 משתלם</button>
    <button onclick="alert('תן כבוד בהמשך')">❤️ תן כבוד</button>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyDplJPY5X9D7PeorWsMwJswqF5Q9vq730",
  authDomain: "afula-equipment.firebaseapp.com",
  projectId: "afula-equipment",
  storageBucket: "afula-equipment.firebasestorage.app",
  messagingSenderId: "1017822544815",
  appId: "1:1017822544815:web:15b410398a8908fc9d655a"
};

const app = initializeApp(firebaseConfig);

window.login = function () {
  const code = document.getElementById("codeInput").value;

  if (!code) {
    document.getElementById("msg").innerText = "הכנס מספר כונן";
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");

  document.getElementById("welcome").innerText =
    "שלום כונן " + code;
};
</script>

</body>
</html>
