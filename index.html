<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת ציוד - עפולה</title>

<style>
body { font-family: Arial; direction: rtl; background:#f5f5f5; text-align:center; }
.box { background:#fff; max-width:500px; margin:auto; padding:20px; border-radius:12px; }
input,button { padding:10px; margin:8px; width:85%; }
button { background:orange; color:white; border:none; border-radius:6px; cursor:pointer; }
.tab { display:none; }
.tab.active { display:block; }
.item { background:#f8f8f8; margin:10px; padding:10px; border-radius:8px; }
</style>
</head>

<body>

<div class="box">

<h2>🚑 מערכת ציוד - עפולה</h2>

<div id="loginBox">
  <input id="codeInput" placeholder="קוד כונן" />
  <button onclick="login()">כניסה</button>
  <p id="msg"></p>
</div>

<div id="menu" style="display:none;">
  <h3 id="welcome"></h3>

  <button onclick="showTab('bls')">BLS</button>
  <button onclick="showTab('mish')">משתלם</button>
  <button onclick="showTab('honor')">תן כבוד</button>

  <div id="bls" class="tab"></div>
  <div id="mish" class="tab"></div>
  <div id="honor" class="tab"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDplJPY5X9d7PeorWsMwJswqF5Q9vq730",
  authDomain: "afula-equipment.firebaseapp.com",
  projectId: "afula-equipment"
});

const db = getFirestore(app);

let currentUser = null;
let state = { bls:[], mish:[], honor:[] };

/* ---------- RESTORE STATE ---------- */
const saved = localStorage.getItem("order_state");
if(saved){
  try{
    state = JSON.parse(saved);
  } catch(e){}
}

/* ---------- SAVE ---------- */
function saveState(){
  localStorage.setItem("order_state", JSON.stringify(state));
}

/* ---------- LOGIN ---------- */
window.login = async function(){

  const code = document.getElementById("codeInput").value.trim();

  const snap = await getDocs(collection(db,"volunteers"));

  let found = null;

  snap.forEach(d=>{
    const x = d.data();
    if(String(x.code) === String(code)) found = x;
  });

  if(!found){
    document.getElementById("msg").innerText="כונן לא נמצא";
    return;
  }

  currentUser = found;

  document.getElementById("loginBox").style.display="none";
  document.getElementById("menu").style.display="block";

  document.getElementById("welcome").innerText="שלום "+found.name;

  await loadMenus();
  renderAll();
};

/* ---------- LOAD MENUS ---------- */
async function loadMenus(){

  const snap = await getDocs(collection(db,"menus"));

  snap.forEach(doc=>{
    const items = doc.data().items;

    state[doc.id] = items.map(i=>({
      name:i.name,
      max:i.max,
      val: state[doc.id]?.find(x=>x.name===i.name)?.val || 0
    }));
  });
}

/* ---------- RENDER ---------- */
function renderAll(){
  render("bls");
  render("mish");
  render("honor");
}

function render(type){

  if(!state[type]) return;

  let html="";

  state[type].forEach((i,idx)=>{
    html+=`
      <div class="item">
        <b>${i.name}</b><br/>
        תקן: ${i.max}<br/>

        <button onclick="minus('${type}',${idx})">➖</button>
        ${i.val}
        <button onclick="plus('${type}',${idx})">➕</button>
      </div>
    `;
  });

  document.getElementById(type).innerHTML=html;
}

/* ---------- TABS ---------- */
window.showTab=function(t){
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.getElementById(t).classList.add("active");
};

/* ---------- PLUS MINUS ---------- */
window.plus=function(t,i){

  if(state[t][i].val < state[t][i].max){
    state[t][i].val++;
    saveState();
    render(t);
  }
};

window.minus=function(t,i){

  if(state[t][i].val > 0){
    state[t][i].val--;
    saveState();
    render(t);
  }
};
</script>

</body>
</html>
